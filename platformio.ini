;
; PlatformIO configuration for Armband PPG + 940nm
; Board: Seeed XIAO ESP32C3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Required libraries (exact names from Library Registry)
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor @ ^1.1.2
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit LIS3DH @ ^1.2.4
    knolleary/PubSubClient @ ^2.8

; Optional but recommended for cleaner builds
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; REQUIRED, not optional: route Serial over native USB.
    ; On the XIAO ESP32C3, UART0 TX is GPIO21 = D6 = the 940 nm emitter drive
    ; pin. Without CDC-on-boot, Serial output is physically driven onto the
    ; emitter and corrupts the 940 nm channel. Matches SETUP.md's Arduino IDE
    ; instruction ("USB CDC On Boot: Enabled").
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
